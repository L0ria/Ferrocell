# CI for the Ferrocell ESP32-S3-Zero firmware (issues #2 M1 .. #7 M6).
#
# 3 jobs (per the M6 decision A8 in issue #7), all run on PRs, no hardware:
#
# core-tests     — job 1 "Unit (host)": builds & runs the PURE-core unit tests
#                  (tests/unit/*.cpp: Color + ColorEngine + Settings + Json +
#                  Api) with the system g++ (no Arduino toolchain, no
#                  hardware). Proves the core is host-testable: `g++ -std=c++17`.
#
# ui-contract    — job 2 "UI contract (Node)": runs the dependency-free Node
#                  harness tests/ui/harness.mjs against ferrocell/data/ui.js —
#                  asserts the endpoints, payload shapes, the color-wheel
#                  hue/saturation mapping, HSV<->RGB, and the presets, plus a
#                  JS<->C++ cross-check (compiles + runs a pure-core probe).
#
# firmware-build — job 3 "Firmware build": builds the REAL firmware with
#                  ./build.sh (arduino-cli + esp32 core 3.3.12,
#                  esp32:esp32:waveshare_esp32_s3_zero, FastLED 3.10.8,
#                  ESP-Wifi-Config vendored in lib/). Exactly the build a dev
#                  machine runs; also compiles ferrocell/src/ + the embedded UI.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Run the pure-core unit tests (Color, ColorEngine, Settings, Json, Api; g++ -std=c++17, no Arduino)"
        run: bash tests/run_tests.sh

  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "Run the web-UI JS-contract harness (Node, zero npm deps; includes the JS<->C++ cross-check)"
        run: node tests/ui/harness.mjs

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host prerequisites (python3 needed by the esp32 core)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3
      - name: "Install arduino-cli (pinned release binary)"
        # arduino/setup-arduino-cli@v1 is broken upstream (issue #29 in Tankie):
        # with "latest" its tag resolution matches zero versions. Install the
        # pinned release binary directly — the same source build.sh uses.
        run: |
          ARDUINO_CLI_VERSION=1.5.1
          curl -fsSL -o /tmp/arduino-cli.tar.gz \
            "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          sudo mkdir -p /opt/arduino-cli
          sudo tar -xzf /tmp/arduino-cli.tar.gz -C /opt/arduino-cli
          sudo ln -sf /opt/arduino-cli/arduino-cli /usr/local/bin/arduino-cli
          arduino-cli version
      - name: "Build the firmware (build.sh: core 3.3.12 + FastLED 3.10.8)"
        run: bash build.sh
      - name: Check the firmware binary
        run: |
          ls -l build/ferrocell.ino.bin
          test -s build/ferrocell.ino.bin
