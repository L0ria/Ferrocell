# Arduino sketch project file (arduino-cli / Arduino IDE 2.x).
#
# Pins the ESP32 core (3.3.12) and the sketch's external libraries so the
# build is reproducible. The authoritative build pins also live in build.sh
# (single source of truth for the CLI build); this file is the IDE/2.x record.
profiles:
  ferrocell:
    fqbn: esp32:esp32:waveshare_esp32_s3_zero
    platforms:
      - platform: esp32:esp32 (3.3.12)
    libraries:
      - FastLED (3.10.8)
      # ESP-Wifi-Config is vendored in lib/ESP-Wifi-Config (v2.2.6) — not a
      # registry lib, so it is not listed here (see libraries.json).
